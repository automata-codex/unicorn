version: '3'

includes:
  flyway:
    taskfile: ./infra/db/Taskfile.yml
    dir: .

tasks:
  up:
    desc: Start infra (db, then flyway migrate). For Workflow B — host-run apps in separate terminals.
    cmds:
      - docker compose up -d --wait db mailhog traefik
      - task: flyway:migrate

  up:all:
    desc: Build and start the entire stack in Docker (Workflow A — first run / sanity check).
    cmds:
      - docker compose up --build

  down:
    desc: Stop and remove the Docker stack. Volumes (and database data) are preserved.
    cmds:
      - docker compose down

  db:backup:
    desc: Back up the local dev database to infra/db/backups/ (or $DB_BACKUP_DIR). Usage — task db:backup [-- <output-file>]
    dotenv: ['.env']
    cmds:
      - ./infra/db/backup.sh {{.CLI_ARGS}}

  db:restore:
    desc: Restore the local dev database from a pg_dump custom-format file. Destructive — drops existing objects. Usage — task db:restore -- <backup-file>
    dotenv: ['.env']
    cmds:
      - ./infra/db/restore.sh {{.CLI_ARGS}}

  playtest:review:
    desc: Render a markdown playtest-review report for an adventure. Usage — task playtest:review -- <adventure-id>
    dir: apps/zoltar-be
    cmds:
      # --env-file=.env picks up DATABASE_URL from the repo-root symlink created during onboarding.
      - npx tsx --env-file=.env scripts/playtest-review.ts {{.CLI_ARGS}}

  playtest:load-synthesis:
    desc: Clone a source adventure's captured synthesis snapshot into a new campaign + adventure. Usage — task playtest:load-synthesis -- <source-adventure-id> [--name "Prompt A run"]
    dir: apps/zoltar-be
    cmds:
      - npx tsx --env-file=.env scripts/load-synthesis.ts {{.CLI_ARGS}}

  eval:capture-fixture:
    desc: Capture a turn's seeded state into an EvalFixture JSON file (M7.4). Usage — task eval:capture-fixture -- <adventure-id> <target-sequence-number> --tag <tag> --id <fixture-id> --output <path> [--force]
    dir: apps/zoltar-be
    cmds:
      - npx tsx --env-file=.env scripts/capture-fixture.ts {{.CLI_ARGS}}

  eval:replay:
    desc: Re-evaluate one already-captured turn against a fixture's checks, without re-running the turn (M7.4.1). Artifact mode reads a frozen warden-output.json from an eval:run directory, no DB at all; database mode re-evaluates a scratch adventure left behind by eval:run --keep-scratch. A judged-mode fixture still makes one real Anthropic call (the judge itself) in either mode. Usage — task eval:replay -- --fixture <id|path> (--run-dir <dir> --rep <n> | --adventure-id <uuid>)
    dir: apps/zoltar-be
    cmds:
      # Plain tsx is fine here, unlike eval:run — this script never goes
      # through Nest's DI container (AnthropicService is constructed
      # directly), so there's no decorator-metadata requirement to satisfy.
      - npx tsx --env-file=.env scripts/eval-replay.ts {{.CLI_ARGS}}

  eval:run:
    desc: 'Run the eval corpus N times under a named model/temperature, writing machine-readable score rows (M7.4.1). Hits a real DB and makes real, token-costing Anthropic calls — N times the cost of a single-pass run. Requires ZOLTAR_EVAL_ROOT. Usage — task eval:run -- --prompt <path> --model <id> --reps <n> [--fixtures <id1,id2>] [--fixtures-dir <dir>] [--run-dir <existing>] [--temperature <t>] [--decision-rule <text>] [--keep-scratch] (paths are relative to apps/zoltar-be)'
    dir: apps/zoltar-be
    cmds:
      # Not tsx — this bootstraps a real NestJS DI container, and tsx
      # (esbuild) doesn't emit the decorator metadata that requires;
      # @swc-node/register does. See the header comment in scripts/eval-run.ts.
      - node -r @swc-node/register -r reflect-metadata --env-file=.env scripts/eval-run.ts {{.CLI_ARGS}}

  eval:report:
    desc: 'Render a markdown report from a run directory written by eval:run (M7.4.1). Pure rendering — no DB, no Anthropic. Requires ZOLTAR_EVAL_ROOT only. Usage — task eval:report -- <run-dir> [--output <path>]'
    dir: apps/zoltar-be
    cmds:
      # Plain tsx is fine here, unlike eval:run — no Nest DI container.
      - npx tsx --env-file=.env scripts/eval-report.ts {{.CLI_ARGS}}

  eval:compare:
    desc: 'Paired comparison of two eval:run directories, pairing on (fixtureId, checkId) (M7.4.1). Pure rendering — no DB, no Anthropic. Requires ZOLTAR_EVAL_ROOT only. Usage — task eval:compare -- <run-dir-a> <run-dir-b> [--filter-rubric CHECK=HASH]... [--filter-harness <version>] [--output <path>]'
    dir: apps/zoltar-be
    cmds:
      # Plain tsx is fine here, unlike eval:run — no Nest DI container.
      - npx tsx --env-file=.env scripts/eval-compare.ts {{.CLI_ARGS}}

  eval:judge-variance:
    desc: 'Re-run judged checks N times against frozen warden-output.json artifacts already on disk — no Warden calls, no DB (M7.4.1). Makes real, token-costing Anthropic calls (judged fixtures x vouched reps x --reps). Requires ANTHROPIC_API_KEY and ZOLTAR_EVAL_ROOT. Usage — task eval:judge-variance -- <run-dir> [--reps 3] [--fixtures <id1,id2>] [--fixtures-dir <dir>] [--output <path>]'
    dir: apps/zoltar-be
    cmds:
      # Plain tsx is fine here — no Nest DI container, AnthropicService is
      # constructed directly.
      - npx tsx --env-file=.env scripts/eval-judge-variance.ts {{.CLI_ARGS}}
